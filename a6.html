<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Strings Methods</h2>
    <p>These are some strings methods:</p>

    <script>
        var str = "amAZiNg";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        document.write("<br>");

        //test methods - > returns true or false
        var str1 = "I leant about methods today";
        var patt = new RegExp("about");
        var res = patt.test(str1);
        document.write(res);

    </script>
</body>
</html>
